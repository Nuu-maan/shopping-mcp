[project]
name = "shopping-mcp"
version = "0.1.0"
description = "MCP server for live product search across Flipkart, Amazon.in, and more"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Nuu-maan" }]
keywords = ["mcp", "shopping", "flipkart", "amazon", "india"]
dependencies = [
    "httpx>=0.27",
    "mcp>=2.2",
]

[project.urls]
Homepage = "https://github.com/Nuu-maan/shopping-mcp"
Repository = "https://github.com/Nuu-maan/shopping-mcp"

[project.scripts]
shopping-mcp = "shopping_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopping_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/shopping_mcp" = "shopping_mcp"
